name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts" "*.ts" "docs/**/*.md" "*.md" package.json

      - name: Lint backend code (Oxlint)
        run: npm run lint

      - name: Typecheck backend (TypeScript)
        run: npx tsc -p tsconfig.build.json --noEmit --incremental false

  frontend-quality:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Lint frontend code (Oxlint)
        run: npm run frontend:lint

      - name: Run frontend tests (Vitest)
        run: npm run frontend:test

      - name: Build frontend bundle (Vite)
        run: npm run frontend:build

  backend-unit-and-e2e:
    name: Backend Unit & E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend unit tests (Vitest)
        run: npm test

      - name: Run backend E2E tests (Vitest)
        run: npm run test:e2e

  backend-integration:
    name: Backend Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: jusdigital
          POSTGRES_USER: jusdigital
          POSTGRES_PASSWORD: jusdigital
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://jusdigital:jusdigital@localhost:5432/jusdigital
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: jusdigital-test-bucket
      GOOGLE_CLIENT_ID: local-test-client-id
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend integration tests (Vitest & Drizzle)
        run: npm run test:integration

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend production image (runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: jusdigital-api:${{ github.sha }}

      - name: Build frontend production image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: jusdigital-frontend:${{ github.sha }}

  ci-status:
    name: CI Status Gate
    runs-on: ubuntu-latest
    needs:
      - lint-and-format
      - frontend-quality
      - backend-unit-and-e2e
      - backend-integration
      - docker-build
    if: always()
    steps:
      - name: Evaluate pipeline results
        run: |
          echo "Evaluating CI job results:"
          echo "  - lint-and-format: ${{ needs.lint-and-format.result }}"
          echo "  - frontend-quality: ${{ needs.frontend-quality.result }}"
          echo "  - backend-unit-and-e2e: ${{ needs.backend-unit-and-e2e.result }}"
          echo "  - backend-integration: ${{ needs.backend-integration.result }}"
          echo "  - docker-build: ${{ needs.docker-build.result }}"

          if [ "${{ needs.lint-and-format.result }}" != "success" ] || \
             [ "${{ needs.frontend-quality.result }}" != "success" ] || \
             [ "${{ needs.backend-unit-and-e2e.result }}" != "success" ] || \
             [ "${{ needs.backend-integration.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "One or more CI checks failed. Blocking gate."
            exit 1
          fi

          echo "All CI checks completed successfully!"

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JusDigital — Teste de análise</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #f4f1ea;
        color: #1d2925;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        width: min(760px, calc(100% - 32px));
        margin: 48px auto;
      }

      header {
        margin-bottom: 24px;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 8px;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(2rem, 5vw, 3.25rem);
        line-height: 1;
      }

      .muted {
        color: #596964;
      }

      .card {
        margin-bottom: 16px;
        padding: 24px;
        border: 1px solid #d2d8d3;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 12px 32px rgb(24 49 40 / 8%);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 4px 10px;
        border-radius: 999px;
        background: #ebece9;
        color: #52605b;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .badge[data-state='success'] {
        background: #dff3e8;
        color: #17603d;
      }

      .badge[data-state='error'] {
        background: #fde7e5;
        color: #9b2c24;
      }

      form {
        display: grid;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 7px;
        font-weight: 700;
      }

      input,
      textarea,
      button {
        font: inherit;
      }

      input,
      textarea {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #bdc8c1;
        border-radius: 10px;
        background: #fff;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      input:focus,
      textarea:focus {
        border-color: #146c4d;
        outline: 3px solid rgb(20 108 77 / 14%);
      }

      button {
        min-height: 44px;
        padding: 10px 16px;
        border: 0;
        border-radius: 10px;
        background: #146c4d;
        color: #fff;
        font-weight: 800;
        cursor: pointer;
      }

      button.secondary {
        background: #e9eeeb;
        color: #29483d;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.55;
      }

      .result {
        min-height: 120px;
        padding: 16px;
        border-radius: 10px;
        background: #f6f8f6;
        white-space: pre-wrap;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 560px) {
        main {
          margin: 24px auto;
        }

        .card {
          padding: 18px;
        }

        .row {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="muted">Ambiente manual local</p>
        <h1>Análise de documentos</h1>
        <p class="muted">
          Autentique-se, envie um documento e valide a resposta real da OpenAI.
        </p>
      </header>

      <section class="card" aria-labelledby="session-title">
        <div class="row">
          <div>
            <h2 id="session-title">1. Sessão Google</h2>
            <p id="profile" class="muted">Verificando sessão…</p>
          </div>
          <span id="session-status" class="badge">Verificando</span>
        </div>
        <div id="google-button"></div>
        <button id="logout" class="secondary hidden" type="button">Sair</button>
      </section>

      <section class="card" aria-labelledby="upload-title">
        <h2 id="upload-title">2. Documento e pergunta</h2>
        <form id="analysis-form">
          <label>
            Arquivo
            <input
              id="file"
              name="file"
              type="file"
              accept=".pdf,.doc,.docx,.txt"
              required
            />
          </label>
          <button id="use-sample" class="secondary" type="button">
            Usar contrato sintético de exemplo
          </button>
          <label>
            Título
            <input
              id="title"
              name="title"
              maxlength="150"
              value="Documento de teste"
              required
            />
          </label>
          <label>
            Pergunta ou instrução
            <textarea
              id="instruction"
              name="instruction"
              maxlength="2000"
              required
            >
Resuma o documento e liste os três pontos mais importantes.</textarea>
          </label>
          <button id="submit" type="submit" disabled>Enviar e analisar</button>
        </form>
      </section>

      <section class="card" aria-labelledby="result-title">
        <div class="row">
          <h2 id="result-title">3. Resultado</h2>
          <span id="analysis-status" class="badge">Aguardando</span>
        </div>
        <div id="result" class="result" role="status" aria-live="polite">
          Faça login e envie um documento para iniciar.
        </div>
      </section>
    </main>

    <script type="module">
      const googleClientId = __GOOGLE_CLIENT_ID__;
      const apiBaseUrl = __API_BASE_URL__;

      const profile = document.querySelector('#profile');
      const sessionStatus = document.querySelector('#session-status');
      const googleButton = document.querySelector('#google-button');
      const logoutButton = document.querySelector('#logout');
      const form = document.querySelector('#analysis-form');
      const fileInput = document.querySelector('#file');
      const useSampleButton = document.querySelector('#use-sample');
      const submitButton = document.querySelector('#submit');
      const analysisStatus = document.querySelector('#analysis-status');
      const result = document.querySelector('#result');
      let authenticated = false;
      let sampleFile = null;

      function setBadge(element, text, state = '') {
        element.textContent = text;
        element.dataset.state = state;
      }

      async function readJson(response) {
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(body.message ?? `Falha HTTP ${response.status}`);
        }
        return body;
      }

      async function completeGoogleSignIn(googleResponse) {
        try {
          await readJson(
            await fetch(`${apiBaseUrl}/auth/google`, {
              method: 'POST',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ credential: googleResponse.credential }),
            }),
          );
          await refreshSession();
        } catch (error) {
          result.textContent = error.message;
          setBadge(sessionStatus, 'Falha no login', 'error');
        }
      }

      function renderGoogleButton() {
        if (!googleClientId) {
          profile.textContent =
            'GOOGLE_CLIENT_ID não está configurado no .env.';
          setBadge(sessionStatus, 'Configuração ausente', 'error');
          return;
        }

        if (!window.google?.accounts?.id) {
          window.setTimeout(renderGoogleButton, 100);
          return;
        }

        window.google.accounts.id.initialize({
          client_id: googleClientId,
          ux_mode: 'popup',
          callback: completeGoogleSignIn,
        });
        window.google.accounts.id.renderButton(googleButton, {
          type: 'standard',
          theme: 'outline',
          size: 'large',
          text: 'signin_with',
          shape: 'rectangular',
        });
      }

      async function refreshSession() {
        const errorCode = new URLSearchParams(window.location.search).get(
          'error',
        );
        if (errorCode) {
          result.textContent = `Falha no login: ${errorCode}`;
          setBadge(analysisStatus, 'Erro de login', 'error');
        }

        try {
          const response = await fetch(`${apiBaseUrl}/auth/me`, {
            credentials: 'include',
          });
          const body = await readJson(response);
          authenticated = true;
          profile.textContent = `${body.user.name} — ${body.user.email}`;
          setBadge(sessionStatus, 'Autenticado', 'success');
          googleButton.classList.add('hidden');
          logoutButton.classList.remove('hidden');
          submitButton.disabled = false;
        } catch {
          authenticated = false;
          profile.textContent = 'Entre com sua conta Google para continuar.';
          setBadge(sessionStatus, 'Não autenticado');
          googleButton.classList.remove('hidden');
          logoutButton.classList.add('hidden');
          submitButton.disabled = true;
          renderGoogleButton();
        }
      }

      logoutButton.addEventListener('click', async () => {
        logoutButton.disabled = true;
        try {
          await readJson(
            await fetch(`${apiBaseUrl}/auth/logout`, {
              method: 'POST',
              credentials: 'include',
            }),
          );
        } catch (error) {
          if (!String(error.message).includes('Unexpected')) {
            result.textContent = error.message;
          }
        } finally {
          logoutButton.disabled = false;
          await refreshSession();
        }
      });

      useSampleButton.addEventListener('click', async () => {
        useSampleButton.disabled = true;
        try {
          const response = await fetch('/fixtures/sample-contract.txt');
          if (!response.ok)
            throw new Error('Não foi possível carregar o exemplo.');

          sampleFile = new File(
            [await response.blob()],
            'sample-contract.txt',
            { type: 'text/plain' },
          );
          result.textContent =
            'Contrato sintético selecionado. Revise a pergunta e envie para analisar.';
          setBadge(analysisStatus, 'Exemplo pronto');
        } catch (error) {
          result.textContent = error.message;
          setBadge(analysisStatus, 'Falhou', 'error');
        } finally {
          useSampleButton.disabled = false;
        }
      });

      fileInput.addEventListener('change', () => {
        sampleFile = null;
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!authenticated) return;

        submitButton.disabled = true;
        result.textContent =
          'Enviando o documento e aguardando a análise. Isso pode levar alguns segundos…';
        setBadge(analysisStatus, 'Processando');

        try {
          const formData = new FormData(form);
          if (sampleFile) formData.set('file', sampleFile);

          const response = await fetch(`${apiBaseUrl}/documents`, {
            method: 'POST',
            credentials: 'include',
            body: formData,
          });
          const body = await readJson(response);
          result.textContent = body.document.analysis;
          setBadge(analysisStatus, body.document.status, 'success');
        } catch (error) {
          result.textContent = error.message;
          setBadge(analysisStatus, 'Falhou', 'error');
        } finally {
          submitButton.disabled = false;
        }
      });

      refreshSession();
    </script>
  </body>
</html>

name: jusdigital

services:
  api:
    build:
      context: .
      target: development
    init: true
    environment:
      NODE_ENV: development
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-development-client-id}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jusdigital}:${POSTGRES_PASSWORD:-jusdigital}@postgres:5432/${POSTGRES_DB:-jusdigital}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/v1/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5

  postgres:
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jusdigital}
      POSTGRES_USER: ${POSTGRES_USER:-jusdigital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jusdigital}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5
    stop_grace_period: 30s

volumes:
  api_node_modules:
  postgres_data:
